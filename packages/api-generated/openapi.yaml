openapi: "3.1.0"
info:
  title: Delego API Gateway
  version: "1.0.0"
  description: |
    Gateway OpenAPI spec for the Delego backend. This file is the single
    source of truth for the generated client types in packages/api-generated.
    Frontend call sites that hand-roll payload shapes should be migrated to
    use the generated types incrementally (#633).

    Migration status:
      - approvals (orders module): ✅ fully typed from this spec
      - delegations: 🎫 ticketed (owner: DelegoLabs/Delego-backend)
      - escrows: 🎫 ticketed
      - wallet: 🎫 ticketed

servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: "https://api.example.com"

components:
  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ApiResponse:
      type: object
      required: [data, error]
      properties:
        data:
          nullable: true
        error:
          nullable: true
          $ref: "#/components/schemas/ErrorBody"

    OrderStatus:
      type: string
      enum:
        - draft
        - pending_approval
        - approved
        - escrowed
        - fulfilled
        - settled
        - cancelled

    RejectionReasonCode:
      type: string
      description: Structured reason recorded when a pending order is rejected (#567).
      enum:
        - too_expensive
        - wrong_item
        - wrong_merchant
        - wrong_time
        - other

    LineItem:
      type: object
      required: [productId, quantity, unitPriceStroops]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPriceStroops:
          type: string
          description: Stroops as a string-encoded bigint

    Order:
      type: object
      required:
        - id
        - userId
        - delegationId
        - merchantId
        - status
        - totalStroops
        - lineItems
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        delegationId:
          type: string
        merchantId:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        totalStroops:
          type: string
          description: Stroops as a string-encoded bigint
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        escrowContractId:
          type: string
          nullable: true
        rejectionReason:
          $ref: "#/components/schemas/RejectionReasonCode"
          nullable: true
        rejectionNote:
          type: string
          nullable: true
          description: Free-text detail accompanying rejectionReason.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrdersResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Order"
              nullable: true

    OrderResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Order"
              nullable: true

    ApproveOrderRequest:
      type: object
      properties: {}

    RejectOrderRequest:
      type: object
      properties:
        rejectionReason:
          $ref: "#/components/schemas/RejectionReasonCode"
          nullable: true
        rejectionNote:
          type: string
          nullable: true
          description: Optional free-text detail accompanying rejectionReason.

paths:
  /orders:
    get:
      operationId: listOrders
      summary: List all orders for the authenticated user
      tags: [approvals, orders]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"
        "401":
          description: Unauthorized

  /orders/{id}/approve:
    post:
      operationId: approveOrder
      summary: Approve a pending order
      tags: [approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveOrderRequest"
      responses:
        "200":
          description: Order approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Order not found
        "401":
          description: Unauthorized

  /orders/{id}/reject:
    post:
      operationId: rejectOrder
      summary: Reject a pending order
      tags: [approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOrderRequest"
      responses:
        "200":
          description: Order rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Order not found
        "401":
          description: Unauthorized
